name: fetch-metrics
on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
jobs:
  fetch-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Get metrics data
        id: get_metrics
        run: |
          USERS=$(curl -s http://localhost:4001/metrics | jq -r .users)
          DEVELOPERS=$(curl -s http://localhost:4001/metrics | jq -r .developers)
          CLIENTS=$(curl -s http://localhost:4001/metrics | jq -r .clients)
          echo USERS: $USERS
          echo DEVELOPERS: $DEVELOPERS
          echo CLIENTS: $CLIENTS
          echo "::set-output name=USERS::$USERS"
          echo "::set-output name=DEVELOPERS::$DEVELOPERS"
          echo "::set-output name=CLIENTS::$CLIENTS"
      - name: Discord notify complete
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_NOTIFICATIONS }}
        uses: Ilshidur/action-discord@0c4b27844ba47cb1c7bee539c8eead5284ce9fa9
        with:
          args: |
            **USERS**
            ```json
            ${{ steps.get_metrics.outputs.USERS }}
            ```
            **DEVELOPERS**
            ```json
            ${{ steps.get_metrics.outputs.DEVELOPERS }}
            ```
            **CLIENTS**
            ${{ steps.get_metrics.outputs.CLIENTS }}
